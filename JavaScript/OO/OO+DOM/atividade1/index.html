<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Cadastro de Produto</h1>

        <div class="formulario">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite o nome do produto">
            <label for="preco">Preço:</label>
            <input type="number" id="preco" placeholder="Digite o preço">
            <label for="categoria">Categoria:</label>
            <input type="text" id="categoria" placeholder="Digite a categoria">
            <label for="desconto">Desconto (%):</label>
            <input type="number" id="desconto" placeholder="Digite o desconto">

            <button id="botaocadastrar">
                Cadastrar Produto
            </button>

        </div>
        <div id="resultado"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
