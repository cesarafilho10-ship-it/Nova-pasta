<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime Search</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>ANIMES</h1>
        <p>Encontre seus animes favoritos</p>
    </header>


    <main>

        <div class="busca">

            <input
                type="text"
                id="nomeAnime"
                placeholder="Digite o nome do anime"
            >

            <button id="botao">
                Buscar
            </button>

        </div>


        <p id="mensagem"></p>


        <div id="resultado"></div>

    </main>


    <footer>
        Anime Search • Dados fornecidos pela AniList API
    </footer>


    <script src="script.js"></script>

</body>

</html>
